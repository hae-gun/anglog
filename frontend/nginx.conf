# Inside the anglog stack (container "web"). TLS and rate limits are done by the front Nginx;
# this one serves the built site and forwards the rest to the api and realtime containers.
# The visitor's IP arrives in X-Forwarded-For from the front Nginx and is passed on as is,
# so Spring (server.forward-headers-strategy=native) sees the real client.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # look the containers up on every request (Docker DNS), so restarting api or realtime alone
  # does not leave this Nginx holding an old address
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;
  set $realtime http://realtime:8090;

  # several photos per diary, each re-encoded in the browser first (backend allows 80 MB per post)
  client_max_body_size 80m;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # uploaded photos (names are random and never change)
  location /media/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # health and other actuator endpoints stay inside
  location /actuator/ { return 404; }

  location = /ws {
    proxy_pass $realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # hashed build files can be cached for good
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # sounds and icons change rarely
  location /sounds/ { expires 7d; try_files $uri =404; }

  # single page app: every other path is the app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
