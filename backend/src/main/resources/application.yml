spring:
  application:
    name: jjaklog-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jjaklog}
    username: ${DB_USER:jjaklog}
    password: ${DB_PASSWORD:jjaklog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 80MB

server:
  port: ${PORT:8080}
  # behind Nginx: take the client IP and https from X-Forwarded-For / X-Forwarded-Proto
  # (only trusted from private network addresses, so nobody can fake it from outside)
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30d
      cookie:
        name: JJAK_SESSION
        http-only: true
        same-site: lax
        # true in production (https only); false for http://localhost
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

jjaklog:
  # Development login (handle + nickname, no password). Must be false in production:
  # anyone could log in as anyone. Real accounts use /api/auth/signup and /api/auth/login.
  auth:
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
  storage:
    # Where uploaded photos are written. Served back under /media/**.
    dir: ${STORAGE_DIR:./storage}
  # Origins (comma separated) allowed to call /api with cookies. Empty in development (Vite proxy,
  # same origin); in production the GitHub Pages address of the screen.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Shared with the 앵파크 realtime server (angpark.token-secret): signs who owns a bird in the park.
  park:
    token-secret: ${PARK_TOKEN_SECRET:local-dev-park-secret}
    # where the admin page reads who is in the park (inside the docker network in production)
    realtime-url: ${PARK_REALTIME_URL:http://localhost:8090}
  # metamoa.com listing: news and events from the admin page. Off until both are set.
  metamoa:
    key: ${METAMOA_KEY:}
    space-id: ${METAMOA_SPACE_ID:}
  # Admin page (/admin): these handles only, comma separated. Empty means nobody.
  admin:
    handles: ${ADMIN_HANDLES:}
  # Day boundaries (streaks, one feather per day) follow Korea time.
  zone: Asia/Seoul
