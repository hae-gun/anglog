# 화면(frontend)을 빌드해서 GitHub Pages(anglog.nobody-asked.dev)로 배포한다.
# 저장소 Settings > Pages > Source 가 "GitHub Actions" 여야 한다.
# API와 앵파크 실시간은 서버(api.anglog.nobody-asked.dev, infra/README.md)에 있다.
name: 화면 배포

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE: https://api.anglog.nobody-asked.dev
          VITE_REALTIME_URL: wss://api.anglog.nobody-asked.dev/ws
      # /park, /room/... 같은 주소로 바로 들어오면 Pages는 404.html을 내준다. 그게 곧 앱이 되게 한다
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
