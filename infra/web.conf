# 앵로그 스택 안쪽 프록시 (컨테이너 "web", 별칭 anglog-web).
# 화면은 GitHub Pages가 내보내고, 이 서버는 API와 앵파크 실시간만 맡는다.
# TLS와 요청 속도 제한은 앞단 Nginx(고해야지 app 서버)가 하고, 여기서는 /api, /media, /ws 를 나눠 보낸다.
# 접속자 IP는 앞단이 붙인 X-Forwarded-For 그대로 넘긴다 (Spring의 forward-headers-strategy=native가 읽음).
server {
  listen 80;
  server_name _;
  server_tokens off;

  # 컨테이너 주소를 요청 때마다 찾는다 (api나 realtime만 다시 띄워도 옛 주소를 붙잡지 않게)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;
  set $realtime http://realtime:8090;

  # 일기 사진 여러 장 (API가 한 번에 80 MB까지 받는다)
  client_max_body_size 80m;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # 올린 사진 (이름이 무작위라 바뀌지 않는다)
  location /media/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  location = /ws {
    proxy_pass $realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # 배포 스크립트의 상태 확인용
  location = /healthz { access_log off; return 200 "ok\n"; }

  location / { return 404; }
}
